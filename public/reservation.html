<!doctype html>
<html lang="ja">
<head>
<title>予約の確認・変更 | mowaプログラミング教室</title>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/assets/mowa-neko.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="demo-bar" id="demoBar" hidden>お試しモード：変更はこのブラウザの中だけに保存されます</div>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-logo"><img src="/assets/mowa-neko.jpg" alt="mowaねこ" width="50" height="35"></span>
      <span class="brand-name"><span id="schoolName">mowaプログラミング教室</span><small>予約の確認・変更</small></span>
    </a>
    <a class="head-link" href="/">新しく予約する</a>
  </div>
</header>
<main class="wrap">
  <section class="panel" id="noToken" hidden>
    <h2>予約の確認・変更</h2>
    <p class="lead">予約のときにお送りしたメールのリンクから開いてください。リンクをコピーしてある場合は、下に貼り付けてください。</p>
    <div class="linkbox"><input id="pasteLink" placeholder="https://…/reservation.html#…" aria-label="予約の確認リンク"><button class="btn small" type="button" id="openLink">開く</button></div>
    <div class="err" id="errLink" hidden></div>
    <p class="lead">メールが見つからないときは、教室へご連絡ください。</p>
  </section>

  <section class="panel" id="view" hidden>
    <h2 id="title"></h2>
    <p class="lead" id="sub"></p>
    <ul class="lesson-list" id="lessons"></ul>
    <div class="actions" id="addRow" hidden><span class="lead" id="addText"></span><button class="btn small" type="button" id="addBtn">日時を追加する</button></div>
    <p class="lead" id="rule"></p>
    <div class="err" id="err" hidden></div>
  </section>

  <section class="panel" id="picker" hidden>
    <h2 id="pickTitle">新しい日時をえらぶ</h2>
    <p class="lead" id="pickLead"></p>
    <div class="cal-head"><span></span><h3 id="monthLabel"></h3><span></span></div>
    <div class="cal" id="cal"></div>
    <div class="legend"><span><b class="ok">○</b> 空きあり</span><span><b class="few">△</b> 残りわずか</span><span><b class="full">×</b> 満席</span><span>休 お休み</span></div>
    <div class="times-box" id="timesBox" hidden><h4 id="timesTitle"></h4><div class="slots" id="slots"></div></div>
    <div class="err" id="errPick" hidden></div>
    <div class="actions"><button class="btn ghost" type="button" id="pickCancel">やめる</button><button class="btn" type="button" id="pickOk" disabled>この日時にする</button></div>
  </section>

  <section class="panel" id="confirmBox" hidden>
    <h2>キャンセルしますか？</h2>
    <p id="confirmText"></p>
    <div class="actions"><button class="btn ghost" type="button" id="confirmNo">やめる</button><button class="btn danger" type="button" id="confirmYes">キャンセルする</button></div>
  </section>
</main>
<footer class="site-foot"><div class="wrap"><span>© mowaソリューションズ株式会社</span><a href="/privacy.html">個人情報の取り扱い</a></div></footer>
<script type="module" src="/js/reservation.js"></script>
</body>
</html>
